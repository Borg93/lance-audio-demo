# The `voiceprint` runner — WeSpeaker 256-d speaker embeddings per diarized turn.
[project]
name = "ratch-runner-voiceprint"
version = "0.0.0"
description = "Speaker-embedding runner (WeSpeaker via pyannote) — Ray Data actor via runners/voiceprint/actor.py."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyannote.audio",
    "torch==2.11.0+cu128",
    "torchaudio==2.11.0+cu128",
]

[tool.uv]
package = false
