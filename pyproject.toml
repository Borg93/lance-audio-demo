[project]
name = "ratch"
version = "0.1.0"
description = "lance-media: media-agnostic Ray Data pipeline + Lance tables (chunk-centric schema, blob-v2 media, word-level alignments, Tantivy FTS via LanceDB)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=21.0.0",
    "lancedb>=0.34.0",
    "pydantic>=2.10",
    "pylance>=4.0.0",
    "typer>=0.12.0",
    # FastAPI viewer backend. python-multipart is required for File/Form
    # parameters (POST /api/search image upload).
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.14.1",
    "fastmcp[apps]>=3.4.2",
    "lance-graph>=0.5.4",
    "ray[data]>=2.56.0",
    "lance-ray>=0.4.2",
    # OpenTelemetry — same core set as lance-ns (services run under the
    # opentelemetry-instrument launcher on the cluster; without the launcher +
    # OTEL_* env these are inert, so local runs are unchanged).
    "opentelemetry-distro>=0.64b0",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
]

[project.optional-dependencies]
# Client-side multimodal extra. Used by:
#   - the `ratch feature text_embedding|frame_embedding` + `extract-chunk-frames` commands
#   - the FastAPI backend at query time (lazy-imported in src/ratch/clients/embedding.py)
# Talks HTTP to a vLLM server; doesn't run a model in-process, so no GPU is
# required to install this extra and no torch conflict with our cu128 pin.
multimodal = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tqdm>=4.66",
]

# Embedding-Atlas projection extra. Used by `ratch feature atlas` to compute the
# 2-D map (EVōC node embedding) + cluster columns from the stored text_embedding.
# EVōC is CPU-only (numba / scikit-learn / tbb) with no torch dependency, so it
# installs cleanly alongside our cu128 pin. Lazy-imported in features/projection.py.
atlas = [
    "evoc>=0.3.1",
    "numpy>=1.26",
    "scikit-learn>=1.1",
]

# In-process model stack for running asr/diarize/voiceprint LOCALLY (pre-merge).
# ratch's CORE is model-free: `import ratch` and the Ray Data orchestration load
# NO model. At merge these run as `runners/*` Ray Serve deployments and
# this extra is unneeded; pre-merge `uv sync --extra models` pulls them in for the
# in-process actor path. Torch pinned to cu128 (driver 570.x -> CUDA 12.8).
models = [
    "easytranscriber",
    "torch==2.11.0+cu128",
    "torchaudio==2.11.0+cu128",
]

# vLLM is NOT a project extra: its torch/torchaudio pins conflict with our
# cu128 versions. Run it instead via `uvx` (uv-managed ephemeral env) — see
# the `embed-server` and `rerank-server` Make targets. That keeps the main
# project resolvable and isolates the vLLM dependency tree.

# The console script and `python -m ratch` share one entry point
# (ratch/__main__.py:main — the writing-python cli.md convention). The legacy
# `ratch` alias + its shim package were removed in the lance-media rename.
[project.scripts]
ratch = "ratch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratch", "runners", "services/common", "services/viewer", "services/search", "services/annotator"]
# Co-locate the vLLM reranker chat template with the only Python module that
# orchestrates the reranker (src/ratch/retrieval/search.py). Hatchling otherwise
# excludes non-.py files from the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/ratch/retrieval/qwen3_vl_reranker.jinja" = "ratch/retrieval/qwen3_vl_reranker.jinja"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

# Dev tooling. Installed with `uv sync --group dev`; not shipped in the wheel.
# httpx is needed both by the [multimodal] extra and by FastAPI's TestClient.
[dependency-groups]
dev = [
    "pytest>=8.0",
    # kg-adapter test loads runners/kg/adapter.py (graph helpers) by path.
    "networkx>=3.0",
    "httpx>=0.27",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: hits the real local Lance dataset (skips when absent)",
]

# ── ruff: lint only ──────────────────────────────────────────────────────────
# We intentionally do NOT enable `ruff format` in CI: the codebase uses
# hand-aligned dict literals and box-drawing comment separators that the
# formatter would reflow into a large, low-signal diff. Run `uvx ruff format`
# manually if you want to adopt it wholesale. Lint, however, is enforced.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "services", "tests"]

[tool.ruff.lint]
# E4/E7/E9 (import placement, statements, syntax) — skips E1/E2/E3 whitespace
# and E501 line-length, which are the formatter's job. BLE keeps the existing
# `# noqa: BLE001` markers meaningful. UP modernizes typing (collections.abc).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "BLE", "RUF"]
ignore = [
    # Ambiguous-unicode rules: this is a Swedish corpus with intentional
    # typography (×, –, ≈, å/ä/ö) in comments, docstrings, and strings.
    "RUF001", "RUF002", "RUF003",
    # Typer's API *requires* calls (Path(...), typer.Option(...)) as parameter
    # defaults — flagging them as function-call-in-default is a false positive.
    "B008",
]

# ── ty: type checking ────────────────────────────────────────────────────────
[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "services", "tests"]
# Sealed-env workers: run in isolated uv envs (--no-project PEP-723 / --with).
# The project resolves transformers 5.x (via the ASR/torch stack); toponymy needs
# transformers<5, and LightRAG is heavy — so these can't share the main env. They
# are never imported by the typed package — exclude from type-checking.
exclude = ["runners"]
